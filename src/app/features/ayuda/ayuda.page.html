<ion-content [fullscreen]="true" class="section-content">
  <div class="section-page">

    <div class="section-header-bar">
      <button class="back-btn" (click)="goBack()" type="button">
        <svg viewBox="0 0 24 24">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <div class="header-info">
        <div class="header-title">Ayuda</div>
        <div class="header-subtitle">Soporte y preguntas frecuentes</div>
      </div>
      <div class="header-spacer"></div>
    </div>

    <div class="scroll-content">
      <div class="empty-state">
        <div class="empty-icon-wrap">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
        <div class="empty-title">Próximamente</div>
        <div class="empty-text">
          Aquí encontrarás respuestas a preguntas frecuentes, guías de uso y canales de contacto para soporte.
        </div>
      </div>
    </div>

  </div>
</ion-content>
