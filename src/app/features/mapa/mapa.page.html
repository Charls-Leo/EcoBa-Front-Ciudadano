<ion-content [scrollY]="false" class="section-content">
  <div class="section-page">

    <div class="section-header-bar" style="position: relative;">
      <button class="back-btn" (click)="goBack()" type="button">
        <svg viewBox="0 0 24 24">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <div class="header-info">
        <div class="header-title">Mapa</div>
        <div class="header-subtitle">Zonas y puntos de acopio</div>
      </div>
      <div class="header-spacer"></div>
    </div>

    <div class="map-container">
      <div id="map" style="width: 100%; height: 100%; z-index: 1;"></div>
      
      <!-- Botón para centrar ubicación -->
      <button *ngIf="trackingState.recorridoActivo" class="center-location-btn" (click)="centerOnLocation()" type="button" style="z-index: 9999;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>

    </div>
  </div>
</ion-content>

<!-- ═══ PANEL INFERIOR CUSTOM (Infalible) ═══ -->
<div class="custom-bottom-sheet" *ngIf="trackingState.recorridoActivo" [class.expanded]="isPanelExpanded">
  
  <!-- Tirador / Header Clickable -->
  <div class="sheet-header" (click)="togglePanel()">
    <div class="sheet-drag-handle"></div>
    
    <!-- Fila 1: Estado + Progreso -->
    <div class="bp-row-top">
      <div class="bp-status" [class.ok]="isEnRuta" [class.desvio]="!isEnRuta">
        <div class="bp-status-dot"></div>
        <span>{{ isEnRuta ? 'EN RUTA' : 'DESVÍO' }}</span>
      </div>
      <div class="bp-progress">
        <div class="bp-progress-bar">
          <div class="bp-progress-fill" [style.width.%]="(trackingState.progreso$ | async) || 0"></div>
        </div>
        <span class="bp-progress-pct">{{ (trackingState.progreso$ | async) || 0 | number:'1.0-0' }}%</span>
      </div>
      
      <!-- Icono que indica si se puede abrir o cerrar -->
      <div class="toggle-icon">
        <svg viewBox="0 0 24 24" *ngIf="!isPanelExpanded"><polyline points="18 15 12 9 6 15"></polyline></svg>
        <svg viewBox="0 0 24 24" *ngIf="isPanelExpanded"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
    </div>
  </div>

  <!-- Contenido expandible (Info + Botones) -->
  <div class="sheet-content">
    <div class="bp-info-full">
      <span class="bp-ruta-name">{{ trackingState.nombreRuta || 'Ruta activa' }}</span>
      <span class="bp-separator">·</span>
      <span class="bp-placa">🚛 {{ trackingState.vehiculoPlaca || '---' }}</span>
    </div>

    <div class="bp-actions-full">
      <button class="bp-btn bp-camera" (click)="tomarFoto()" [disabled]="isTakingPhoto" type="button">
        <svg viewBox="0 0 24 24" *ngIf="!isTakingPhoto">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
        <ion-spinner name="crescent" *ngIf="isTakingPhoto" class="btn-spinner-sm"></ion-spinner>
        <span>{{ isTakingPhoto ? 'Capturando...' : 'Tomar Foto' }}</span>
      </button>
      <button class="bp-btn bp-stop" (click)="confirmarFinalizarRecorrido()" [disabled]="isFinishing" type="button">
        <svg viewBox="0 0 24 24" *ngIf="!isFinishing">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        </svg>
        <ion-spinner name="crescent" *ngIf="isFinishing" class="btn-spinner-sm"></ion-spinner>
        <span>{{ isFinishing ? 'Finalizando...' : 'Finalizar Recorrido' }}</span>
      </button>
    </div>
  </div>

</div>

<!-- ═══ PREVIEW DE FOTO ═══ -->
<div class="photo-preview-overlay" *ngIf="photoPreview" (click)="cerrarPreview()">
  <div class="photo-preview-card" (click)="$event.stopPropagation()">
    <img [src]="photoPreview" alt="Foto capturada" class="preview-image" />
    <div class="preview-actions">
      <button class="preview-btn discard-btn" (click)="descartarFoto()" type="button">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
        Descartar
      </button>
      <button class="preview-btn save-btn" (click)="enviarFoto()" [disabled]="isSendingPhoto" type="button">
        <svg viewBox="0 0 24 24" *ngIf="!isSendingPhoto">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <ion-spinner name="crescent" *ngIf="isSendingPhoto" class="btn-spinner-sm"></ion-spinner>
        {{ isSendingPhoto ? 'Enviando...' : 'Enviar' }}
      </button>
    </div>
    <div class="preview-status" *ngIf="photoStatusMsg">
      <span [class.success]="photoStatusSuccess" [class.error]="!photoStatusSuccess">
        {{ photoStatusMsg }}
      </span>
    </div>
  </div>
</div>
