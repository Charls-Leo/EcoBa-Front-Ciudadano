<ion-header class="ion-no-border">
  <div class="top-bar">
    <div class="top-bar-logo">
      <div class="top-logo-icon">
        <img src="assets/images/logo3.png" alt="Logo EcoBahía" class="top-logo-img" />
      </div>
      <span class="top-logo-text">Eco<span>Bahía</span></span>
    </div>

    <div class="top-bar-actions">
      <div class="citizen-chip">Ciudadano</div>
      <button
        class="theme-toggle"
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="themeService.isDarkMode ? 'Activar modo claro' : 'Activar modo noche'">
        <svg *ngIf="!themeService.isDarkMode" viewBox="0 0 24 24">
          <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"></path>
        </svg>
        <svg *ngIf="themeService.isDarkMode" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2"></path>
          <path d="M12 20v2"></path>
          <path d="m4.93 4.93 1.41 1.41"></path>
          <path d="m17.66 17.66 1.41 1.41"></path>
          <path d="M2 12h2"></path>
          <path d="M20 12h2"></path>
          <path d="m6.34 17.66-1.41 1.41"></path>
          <path d="m19.07 4.93-1.41 1.41"></path>
        </svg>
      </button>
    </div>
  </div>
</ion-header>

<ion-content [fullscreen]="true" class="home-content">
  <div class="home-page">

    <div class="scroll-content">
      <div class="greeting-section">
        <div class="greeting-name">Hola, <span>bienvenido</span></div>
        <div class="greeting-sub">Tu guía ciudadana para la recolección y el reciclaje</div>
      </div>

      <div class="banner-section">
        <div class="banner-card">
          <div class="banner-blob"></div>
          <div class="banner-blob2"></div>

          <div class="banner-text">
            <div class="banner-label">Hoy</div>
            <div class="banner-title">Consulta tu ruta<br>de recolección</div>
            <button class="banner-cta" type="button" (click)="goTo('/tabs/rutas')">Ver rutas</button>
          </div>

          <div class="banner-illustration">
            <img src="assets/images/camión.png" alt="Camión de recolección" class="banner-truck-img" />
          </div>
        </div>
      </div>

      <div class="section-header">
        <span class="section-title">Acceso rápido</span>
      </div>

      <div class="grid-section">
        <div class="quick-grid">
          <div
            class="quick-card"
            [ngClass]="item.cardClass"
            *ngFor="let item of quickAccess"
            (click)="goTo(item.route)">
            <div class="card-corner"></div>

            <div class="card-icon-wrap">
              <ng-container [ngSwitch]="item.icon">
                <svg *ngSwitchCase="'routes'" viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                </svg>

                <svg *ngSwitchCase="'map'" viewBox="0 0 24 24">
                  <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                  <line x1="8" y1="2" x2="8" y2="18"></line>
                  <line x1="16" y1="6" x2="16" y2="22"></line>
                </svg>

                <svg *ngSwitchCase="'help'" viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="10"></circle>
                  <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                  <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>

                <svg *ngSwitchCase="'report'" viewBox="0 0 24 24">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                  <line x1="12" y1="8" x2="12" y2="12"></line>
                  <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>

                <svg *ngSwitchCase="'learn'" viewBox="0 0 24 24">
                  <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                  <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"></path>
                  <path d="M8 7h8"></path>
                  <path d="M8 11h6"></path>
                </svg>

                <svg *ngSwitchCase="'calendar'" viewBox="0 0 24 24">
                  <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                  <path d="M16 2v4"></path>
                  <path d="M8 2v4"></path>
                  <path d="M3 10h18"></path>
                  <path d="M8 14h.01"></path>
                  <path d="M12 14h.01"></path>
                  <path d="M16 14h.01"></path>
                </svg>
              </ng-container>
            </div>

            <div class="card-label">{{ item.title }}</div>
            <div class="card-desc">{{ item.desc }}</div>
          </div>
        </div>
      </div>

      <div class="section-header">
        <span class="section-title">Para tener presente</span>
      </div>

      <div class="activity-section">
        <div class="activity-list">
          <div class="activity-item" *ngFor="let activity of recentActivity">
            <div class="activity-icon" [style.background]="activity.bg">
              <ng-container [ngSwitch]="activity.icon">
                <svg *ngSwitchCase="'learn'" viewBox="0 0 24 24" [style.stroke]="activity.iconColor">
                  <path d="M12 2l3 7h7l-5.5 4.5 2 7L12 16l-6.5 4.5 2-7L2 9h7z"></path>
                </svg>

                <svg *ngSwitchCase="'report'" viewBox="0 0 24 24" [style.stroke]="activity.iconColor">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
              </ng-container>
            </div>

            <div class="activity-text">
              <div class="activity-title">{{ activity.title }}</div>
              <div class="activity-sub">{{ activity.sub }}</div>
            </div>

            <span class="activity-badge" [ngClass]="activity.badgeClass">{{ activity.badge }}</span>
          </div>
        </div>
      </div>

      <div class="home-background-art">
        <img src="assets/images/imgFondo-home.png" alt="Fondo EcoBahía" class="home-background-img" />
      </div>
    </div>

  </div>
</ion-content>
